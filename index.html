<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <h1 class="header__title">Lumen.</h1>
            <nav class="header__mainmenu">
                <ul>
                    <li><a class="mainmenu__link" href="">О нас</a></li>
                    <li><a class="mainmenu__link" href="">Каталог</a></li>
                    <li><a class="mainmenu__link" href="">Обратная связь</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="section banner">
            <div class="container">
                2
            </div>
        </section>
        <section class="section about"> 
            <div class="container">
                3
            </div>
        </section>
        <section class="section catalog">
            <div class="container">
                <h2 class="catalog__title">Каталог</h2>
                <div class="catalog">
                    <div class="catalog__wrapper">
                        <div class="catalog__container">
                            <div class="catalog__card">
                                <img class="card__img" src="img/frame7.png" alt="">
                                <h3 class="card__title">Where Shadows Lerns to Dance</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                            </div>
                            <div class="catalog__card">
                                <img class="card__img" src="img/frame7_1.png" alt="">
                                <h3 class="card__title">The Long Echo of Evening</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                            </div>
                            <div class="catalog__card">
                                <img class="card__img" src="img/frame7_2.png" alt="">
                                <h3 class="card__title">Still</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                            </div>
                            <div class="catalog__card">
                                <img class="card__img" src="img/frame7_3.png" alt="">
                                <h3 class="card__title">Dusk</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                            </div>
                        </div>
                    </div>
                    <div class="catalog__button">
                        <button class="catalog__btn" aria-label="Назад">
                            <svg width="14" height="27" viewBox="0 0 14 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L2 13.5L12 25" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button class="catalog__btn" aria-label="Вперёд">
                            <svg width="14" height="27" viewBox="0 0 14 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2 2L12 13.5L2 25" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <section class="section feedback">
            <div class="container">
                <div class="feedback__intro">
                    <h2 class="feedback__title">ОСТАЛИСЬ ВОПРОСЫ?</h2>
                    <img class="feedback__img" src="img/image5.png" alt="">
                </div>
                <div class="feedback__main">
                    <form class="feedback__form" action="">
                        <div class="form__item">
                            <input class="formElem form__input" type="text" name="name" placeholder="имя" required>
                        </div>
                        <div class="form__item">
                            <input class="formElem form__input" type="tel" name="phone" placeholder="телефон" required>
                        </div>
                        <div class="form__item">
                            <input class="formElem form__input" type="email" name="mail" placeholder="email" required>
                        </div>
                        <div class="form__item">
                            <textarea class="formElem form__textarea" name="message" placeholder="напишите ваш вопрос" required></textarea>
                        </div>
                        <div class="form__item">
                            <input class="formElem form__submit" type="submit" value="отправить">
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <section class="section contacts">
            <div class="container">
                6
            </div>
        </section>
        <section class="section copylight">
            <div class="container">
                7
            </div>
        </section>
    </footer>
</body>
</html>
